<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
    <link rel="icon" href="./images/favicon.png" type="image/png">
</head>
<body>
    <main>
        <div class="container">
            <div class="title">
                <h1 id="title">Todo List</h1>
            </div>
            <div class="add-task">
                <input type="text" id="input-text" placeholder="Escreva sua tarefa...">
                <button id="button">Adicionar tarefa</button>
            </div>
            <div class="list">
                <button id="clear-button">Remover todas</button>
                <ul id="task-list"></ul>
            </div>
        </div>
    </main>
    <footer>
        <p>Desenvolvido por Ryan</p>
        <p>2026</p>
    </footer>
</body>
</html>
